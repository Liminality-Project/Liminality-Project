name: Copilot Setup Steps
description: Pre-setup environment steps to resolve firewall connectivity issues

steps:
  - name: Setup .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: |
        6.0.x
        7.0.x
        8.0.x

  - name: Cache NuGet packages
    uses: actions/cache@v4
    with:
      path: ~/.nuget/packages
      key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
      restore-keys: |
        ${{ runner.os }}-nuget-

  - name: Pre-download NuGet packages
    run: |
      dotnet restore --no-cache --verbosity minimal
      dotnet restore Content.Server/Content.Server.csproj --no-cache --verbosity minimal
      dotnet restore Content.Client/Content.Client.csproj --no-cache --verbosity minimal
      dotnet restore Content.Shared/Content.Shared.csproj --no-cache --verbosity minimal
      dotnet restore Content.IntegrationTests/Content.IntegrationTests.csproj --no-cache --verbosity minimal

  - name: Configure dotnet for offline operation
    run: |
      dotnet nuget locals all --clear
      echo "DOTNET_CLI_DISABLE_PUBLISH_AND_PACK_WARNINGS=true" >> $GITHUB_ENV
      echo "DOTNET_SKIP_FIRST_TIME_EXPERIENCE=true" >> $GITHUB_ENV
      echo "DOTNET_CLI_TELEMETRY_OPTOUT=true" >> $GITHUB_ENV